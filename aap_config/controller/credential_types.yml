---
# AAP Controller Custom Credential Types Configuration

controller_credential_types:
  # Custom credential type for Slack webhooks
  - name: Slack Webhook
    description: "Slack incoming webhook URL for sending notifications"
    kind: cloud
    inputs:
      fields:
        - id: slack_webhook_url
          type: string
          label: Slack Webhook URL
          secret: true
          help_text: "Slack incoming webhook URL (https://hooks.slack.com/services/...)"
      required:
        - slack_webhook_url
    injectors:
      env:
        SLACK_WEBHOOK_URL: !unsafe "{{ slack_webhook_url }}"
      extra_vars:
        slack_webhook_url: !unsafe "{{ slack_webhook_url }}"

  # Custom credential type for GitHub Personal Access Token
  - name: GitHub PAT
    description: "GitHub Personal Access Token for API access"
    kind: cloud
    inputs:
      fields:
        - id: github_pat
          type: string
          label: GitHub Personal Access Token
          secret: true
          help_text: "GitHub PAT with repo or admin:org scope for runner management"
      required:
        - github_pat
    injectors:
      env:
        GITHUB_PAT: !unsafe "{{ github_pat }}"
      extra_vars:
        github_pat: !unsafe "{{ github_pat }}"

  # Custom credential type for GitHub Runner Token (optional/legacy)
  - name: GitHub Runner Token
    description: "GitHub Actions runner registration token (short-lived, generated via UI or API)"
    kind: cloud
    inputs:
      fields:
        - id: github_runner_token
          type: string
          label: GitHub Runner Registration Token
          secret: true
          help_text: "Runner registration token from GitHub (valid for 1 hour)"
      required:
        - github_runner_token
    injectors:
      env:
        GITHUB_RUNNER_TOKEN: !unsafe "{{ github_runner_token }}"
      extra_vars:
        github_runner_token: !unsafe "{{ github_runner_token }}"
