---
# AAP Controller Credentials Configuration

controller_credentials:
  # GitHub Personal Access Token (PAT) for API access
  # Used to dynamically generate runner registration tokens
  - name: GitHub PAT
    organization: CI/CD
    credential_type: Custom Credential
    description: "GitHub Personal Access Token for API access (admin:org or repo scope)"
    inputs:
      fields:
        - id: github_pat
          label: GitHub PAT
          type: string
          secret: true

  # GitHub Runner Token Credential (Legacy - manual token)
  # Uses credential input source to pull token from external secret manager
  # Optional: Only needed if NOT using dynamic token generation
  - name: GitHub Runner Token
    organization: CI/CD
    credential_type: Custom Credential
    description: "GitHub Actions runner registration token from external secret manager (optional if using PAT)"
    inputs:
      fields:
        - id: github_token
          label: GitHub Token
          type: string
          secret: true

  # Red Hat Registry Credential for pulling execution environments
  - name: Red Hat Registry
    organization: CI/CD
    credential_type: Container Registry
    description: "Red Hat registry authentication for pulling AAP execution environments"
    inputs:
      host: registry.redhat.io
      username: "{{ redhat_registry_username }}"
      password: "{{ redhat_registry_password }}"
      verify_ssl: true

  # Slack Webhook Credential for notifications
  - name: Slack Webhook
    organization: CI/CD
    credential_type: Custom Credential
    description: "Slack webhook URL for sending notifications from external secret manager"
    inputs:
      fields:
        - id: slack_webhook_url
          label: Slack Webhook URL
          type: string
          secret: true

# Credential Input Sources
# Pulls secrets from external secret manager at runtime
controller_credential_input_sources:
  # GitHub PAT for dynamic token generation (Recommended)
  - credential: GitHub PAT
    input_field_name: github_pat
    source_credential: External Secret Manager
    target_field: pat
    metadata:
      object_query: "github_pat"
      object_query_format: "Exact"

  # GitHub Runner Token (Legacy - optional)
  - credential: GitHub Runner Token
    input_field_name: github_token
    source_credential: External Secret Manager
    target_field: token
    metadata:
      object_query: "github_runner_token"
      object_query_format: "Exact"

  - credential: Red Hat Registry
    input_field_name: username
    source_credential: External Secret Manager
    target_field: username
    metadata:
      object_query: "redhat_registry_username"
      object_query_format: "Exact"

  - credential: Red Hat Registry
    input_field_name: password
    source_credential: External Secret Manager
    target_field: password
    metadata:
      object_query: "redhat_registry_password"
      object_query_format: "Exact"

  - credential: Slack Webhook
    input_field_name: slack_webhook_url
    source_credential: External Secret Manager
    target_field: webhook_url
    metadata:
      object_query: "slack_webhook_url"
      object_query_format: "Exact"
