---
# AAP Controller Credentials Configuration

controller_credentials:
  # GitHub Personal Access Token (PAT) for API access
  # Used to dynamically generate runner registration tokens
  - name: GitHub PAT Credential
    organization: CI/CD
    credential_type: GitHub PAT  # References custom credential type
    description: "GitHub Personal Access Token for API access (admin:org or repo scope)"
    inputs:
      github_pat: "{{ vault_github_pat }}"

  # GitHub Runner Token Credential (Legacy - manual token)
  # Optional: Only needed if NOT using dynamic token generation
  - name: GitHub Runner Token Credential
    organization: CI/CD
    credential_type: GitHub Runner Token  # References custom credential type
    description: "GitHub Actions runner registration token (optional if using PAT)"
    inputs:
      github_runner_token: "{{ vault_github_runner_token }}"

  # Red Hat Registry Credential for pulling execution environments
  - name: Red Hat Registry Credential
    organization: CI/CD
    credential_type: Container Registry
    description: "Red Hat registry authentication for pulling AAP execution environments"
    inputs:
      host: registry.redhat.io
      username: "{{ vault_redhat_registry_username }}"
      password: "{{ vault_redhat_registry_password }}"
      verify_ssl: true

  # Slack Webhook Credential for notifications
  - name: Slack Webhook Credential
    organization: CI/CD
    credential_type: Slack Webhook  # References custom credential type
    description: "Slack webhook URL for sending notifications"
    inputs:
      slack_webhook_url: "{{ vault_slack_webhook_url }}"

