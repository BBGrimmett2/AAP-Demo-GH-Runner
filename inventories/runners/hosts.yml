---
# GitHub Actions Runners Inventory
# Replace placeholder values with actual runner host information

all:
  children:
    github_runners:
      children:
        github_runners_rhel:
          hosts:
            runner-rhel-01:
              ansible_host: <RHEL_RUNNER_IP_OR_HOSTNAME>
              ansible_user: ansible  # SSH user with sudo access
              ansible_become: true

        github_runners_windows:
          hosts:
            runner-win-01:
              ansible_host: <WINDOWS_RUNNER_IP_OR_HOSTNAME>
              ansible_user: Administrator
              ansible_connection: winrm
              ansible_winrm_transport: ntlm
              ansible_winrm_server_cert_validation: ignore
              ansible_port: 5986

      vars:
        # GitHub repository URL where runners will be registered
        github_runner_url: "https://github.com/RedHatOfficial/aap-demo"

        # GitHub runner token will be provided via AAP credential input source
        # Do not hardcode the token here - it should come from external secret manager
        github_runner_token: "{{ lookup('env', 'GITHUB_RUNNER_TOKEN') | default('') }}"

        # Custom labels for all runners
        github_runner_labels:
          - aap-demo
          - podman
