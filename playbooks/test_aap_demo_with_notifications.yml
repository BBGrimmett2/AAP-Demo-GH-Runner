---
# Test AAP Demo with Slack Notifications
# This playbook wraps the tests with failure notifications

- name: Test AAP Demo
  hosts: "{{ target_host | default('github_runners') }}"
  gather_facts: false

  vars:
    test_type: "{{ test_type | default('all') }}"
    job_context:
      job_name: "Test AAP Demo ({{ test_type }})"
      job_id: "{{ awx_job_id | default(tower_job_id) | default('manual') }}"
      job_url: "{{ awx_job_template_url | default(tower_job_template_url) | default('') }}"
      runner_host: "{{ inventory_hostname }}"

  tasks:
    - name: Run AAP Demo tests
      block:
        - name: Execute tests
          ansible.builtin.import_role:
            name: aap_demo
            tasks_from: test
          vars:
            test_type: "{{ test_type }}"

        - name: Set test success flag
          ansible.builtin.set_fact:
            tests_succeeded: true

      rescue:
        - name: Set test failure flag
          ansible.builtin.set_fact:
            tests_succeeded: false
            test_error: "{{ ansible_failed_result.msg | default('Tests failed') }}"

        - name: Send Slack failure notification
          ansible.builtin.import_role:
            name: slack_notification
            tasks_from: send
          vars:
            notification_type: "failure"
            job_name: "{{ job_context.job_name }}"
            job_status: "failed"
            job_id: "{{ job_context.job_id }}"
            job_url: "{{ job_context.job_url }}"
            error_message: "{{ test_error }}"
            extra_info:
              runner: "{{ job_context.runner_host }}"
              test_type: "{{ test_type }}"
              pr_number: "{{ pr_number | default('N/A') }}"
          delegate_to: localhost
          run_once: true

        - name: Fail the playbook
          ansible.builtin.fail:
            msg: "Tests failed: {{ test_error }}"

  post_tasks:
    - name: Send Slack success notification
      ansible.builtin.import_role:
        name: slack_notification
        tasks_from: send
      vars:
        notification_type: "success"
        job_name: "{{ job_context.job_name }}"
        job_status: "passed"
        job_id: "{{ job_context.job_id }}"
        job_url: "{{ job_context.job_url }}"
        extra_info:
          runner: "{{ job_context.runner_host }}"
          test_type: "{{ test_type }}"
      delegate_to: localhost
      run_once: true
      when: tests_succeeded | default(false)
