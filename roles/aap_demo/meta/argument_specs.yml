---
argument_specs:
  main:
    short_description: Clone and manage AAP Demo repository
    description:
      - Clones AAP Demo repository from GitHub
      - Runs status checks and tests
      - Provides cleanup functionality
    author: Ansible Automation

    options:
      aap_demo_repo_url:
        description: AAP Demo repository URL
        type: str
        default: "https://github.com/RedHatOfficial/aap-demo.git"

      aap_demo_branch:
        description: Git branch to clone
        type: str
        default: "main"

      aap_demo_workdir:
        description: Working directory for AAP Demo repository
        type: str
        default: "/tmp/aap-demo"

  deploy:
    short_description: Clone AAP Demo repository
    description:
      - Clones or updates AAP Demo repository from GitHub
      - Does not install Podman Desktop or start services

    options:
      aap_demo_repo_url:
        description: Repository URL
        type: str
        required: true

      aap_demo_branch:
        description: Branch to clone
        type: str
        default: "main"

  status:
    short_description: Check AAP Demo repository status
    description:
      - Verifies AAP Demo repository is cloned
      - Returns repository information

    options:
      aap_demo_workdir:
        description: AAP Demo directory
        type: str
        required: true

  test:
    short_description: Run AAP Demo repository tests
    description:
      - Executes AAP Demo test suite
      - Supports deploy and status tests

    options:
      test_type:
        description: Type of test to run (deploy, status, or all)
        type: str
        default: "all"

  cleanup:
    short_description: Clean up AAP Demo repository
    description:
      - Removes AAP Demo repository directory

    options:
      aap_demo_workdir:
        description: AAP Demo directory to clean
        type: str
        required: true
