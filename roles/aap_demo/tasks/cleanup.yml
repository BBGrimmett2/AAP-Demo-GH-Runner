---
# Public function: Clean up AAP Demo deployment

- name: Check if AAP Demo is deployed
  ansible.builtin.stat:
    path: "{{ aap_demo_workdir }}"
  register: aap_demo_cleanup_check

- name: Stop AAP Demo services
  when: aap_demo_cleanup_check.stat.exists
  block:
    - name: Stop AAP Demo
      ansible.builtin.command:
        cmd: "{{ aap_demo_cli }} stop"
        chdir: "{{ aap_demo_workdir }}"
      register: aap_demo_stop_result
      changed_when: aap_demo_stop_result.rc == 0
      failed_when: false
      ignore_errors: true

    - name: Remove AAP Demo containers
      ansible.builtin.command:
        cmd: podman rm -f --all
      register: podman_cleanup
      changed_when: podman_cleanup.rc == 0
      failed_when: false
      ignore_errors: true

- name: Remove AAP Demo directory
  ansible.builtin.file:
    path: "{{ aap_demo_workdir }}"
    state: absent
  when: aap_demo_cleanup_check.stat.exists

- name: Verify cleanup completed
  ansible.builtin.stat:
    path: "{{ aap_demo_workdir }}"
  register: aap_demo_cleanup_verify
  failed_when: aap_demo_cleanup_verify.stat.exists
