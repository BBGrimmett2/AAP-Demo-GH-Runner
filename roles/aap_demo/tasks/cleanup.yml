---
# Public function: Clean up AAP Demo repository

- name: Check if AAP Demo repository exists
  ansible.builtin.stat:
    path: "{{ aap_demo_workdir }}"
  register: aap_demo_cleanup_check

- name: Remove AAP Demo directory
  ansible.builtin.file:
    path: "{{ aap_demo_workdir }}"
    state: absent
  when: aap_demo_cleanup_check.stat.exists

- name: Verify cleanup completed
  ansible.builtin.stat:
    path: "{{ aap_demo_workdir }}"
  register: aap_demo_cleanup_verify
  failed_when: aap_demo_cleanup_verify.stat.exists

- name: Display cleanup result
  ansible.builtin.debug:
    msg: "AAP Demo repository removed from {{ aap_demo_workdir }}"
  when: aap_demo_cleanup_check.stat.exists
