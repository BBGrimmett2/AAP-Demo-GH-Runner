---
# Public function: Deploy AAP Demo

- name: Check if AAP Demo is already cloned
  ansible.builtin.stat:
    path: "{{ aap_demo_workdir }}/.git"
  register: aap_demo_cloned

- name: Clone AAP Demo repository
  ansible.builtin.git:
    repo: "{{ aap_demo_repo_url }}"
    dest: "{{ aap_demo_workdir }}"
    version: "{{ aap_demo_branch }}"
    force: true
  register: aap_demo_clone
  when: not aap_demo_cloned.stat.exists

- name: Update AAP Demo repository
  ansible.builtin.git:
    repo: "{{ aap_demo_repo_url }}"
    dest: "{{ aap_demo_workdir }}"
    version: "{{ aap_demo_branch }}"
    update: true
  register: aap_demo_update
  when: aap_demo_cloned.stat.exists

- name: Check if AAP Demo CLI exists
  ansible.builtin.stat:
    path: "{{ aap_demo_cli }}"
  register: aap_demo_cli_check

- name: Make AAP Demo CLI executable
  ansible.builtin.file:
    path: "{{ aap_demo_cli }}"
    mode: '0755'
  when: aap_demo_cli_check.stat.exists

- name: Deploy AAP Demo
  ansible.builtin.command:
    cmd: "{{ aap_demo_cli }} deploy"
    chdir: "{{ aap_demo_workdir }}"
  register: aap_demo_deploy_result
  async: "{{ aap_demo_deploy_timeout }}"
  poll: 10
  changed_when: aap_demo_deploy_result.rc == 0
  failed_when: aap_demo_deploy_result.rc != 0
  when: aap_demo_cli_check.stat.exists

- name: Display deployment result
  ansible.builtin.debug:
    msg: "AAP Demo deployment completed successfully"
  when: aap_demo_deploy_result is defined and aap_demo_deploy_result.rc == 0
