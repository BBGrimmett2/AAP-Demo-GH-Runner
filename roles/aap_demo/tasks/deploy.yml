---
# Public function: Deploy AAP Demo (clone repository only)

- name: Check if AAP Demo is already cloned
  ansible.builtin.stat:
    path: "{{ aap_demo_workdir }}/.git"
  register: aap_demo_cloned

- name: Clone AAP Demo repository
  ansible.builtin.git:
    repo: "{{ aap_demo_repo_url }}"
    dest: "{{ aap_demo_workdir }}"
    version: "{{ aap_demo_branch }}"
    force: true
  register: aap_demo_clone
  when: not aap_demo_cloned.stat.exists

- name: Update AAP Demo repository
  ansible.builtin.git:
    repo: "{{ aap_demo_repo_url }}"
    dest: "{{ aap_demo_workdir }}"
    version: "{{ aap_demo_branch }}"
    update: true
  register: aap_demo_update
  when: aap_demo_cloned.stat.exists

- name: Display clone result
  ansible.builtin.debug:
    msg: "AAP Demo repository cloned to {{ aap_demo_workdir }}"
  when: aap_demo_clone is changed

- name: Display update result
  ansible.builtin.debug:
    msg: "AAP Demo repository updated at {{ aap_demo_workdir }}"
  when: aap_demo_update is changed
