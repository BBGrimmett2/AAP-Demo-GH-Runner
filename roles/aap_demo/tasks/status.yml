---
# Public function: Check AAP Demo status

- name: Check if AAP Demo repository exists
  ansible.builtin.stat:
    path: "{{ aap_demo_workdir }}/.git"
  register: aap_demo_repo

- name: Assert AAP Demo repository is cloned
  ansible.builtin.assert:
    that:
      - aap_demo_repo.stat.exists
    fail_msg: "AAP Demo repository is not cloned at {{ aap_demo_workdir }}"
    success_msg: "AAP Demo repository exists at {{ aap_demo_workdir }}"

- name: Get repository information
  ansible.builtin.command:
    cmd: git rev-parse --short HEAD
    chdir: "{{ aap_demo_workdir }}"
  register: aap_demo_git_commit
  changed_when: false
  failed_when: false
  when: aap_demo_repo.stat.exists

- name: Display AAP Demo repository status
  ansible.builtin.debug:
    msg:
      - "Repository location: {{ aap_demo_workdir }}"
      - "Current commit: {{ aap_demo_git_commit.stdout | default('unknown') }}"

- name: Set status result fact
  ansible.builtin.set_fact:
    aap_demo_status: "{{ 'cloned' if aap_demo_repo.stat.exists else 'not_cloned' }}"
