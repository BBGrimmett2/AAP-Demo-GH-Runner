---
# System update tasks

- name: Update all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  register: system_update_result

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file
  changed_when: false

- name: Reboot if required
  ansible.builtin.reboot:
    msg: "Rebooting after system updates"
    reboot_timeout: 600
  when:
    - fedora_reboot_if_required | bool
    - system_update_result.changed or reboot_required_file.stat.exists
