---
# Public function: Generate GitHub runner registration token via API
# Requires: github_pat (GitHub Personal Access Token with admin:org or repo scope)

- name: Validate GitHub PAT is provided
  ansible.builtin.assert:
    that:
      - github_pat is defined
      - github_pat | length > 0
    fail_msg: "github_pat (GitHub Personal Access Token) must be provided for dynamic token generation"
    success_msg: "GitHub PAT is available"
  no_log: true

- name: Extract repository owner and name from URL
  ansible.builtin.set_fact:
    _github_repo_parts: "{{ github_runner_url | regex_replace('^https://github.com/', '') | split('/') }}"

- name: Set repository owner and name
  ansible.builtin.set_fact:
    _github_owner: "{{ _github_repo_parts[0] }}"
    _github_repo: "{{ _github_repo_parts[1] }}"

- name: Display repository information
  ansible.builtin.debug:
    msg: "Generating runner registration token for {{ _github_owner }}/{{ _github_repo }}"

- name: Generate runner registration token via GitHub API
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ _github_owner }}/{{ _github_repo }}/actions/runners/registration-token"
    method: POST
    headers:
      Accept: "application/vnd.github+json"
      Authorization: "Bearer {{ github_pat }}"
      X-GitHub-Api-Version: "2022-11-28"
    status_code: 201
    timeout: 30
  register: _token_response
  no_log: true

- name: Set runner token fact
  ansible.builtin.set_fact:
    github_runner_token: "{{ _token_response.json.token }}"
    github_runner_token_expires_at: "{{ _token_response.json.expires_at }}"
  no_log: true

- name: Display token expiration time
  ansible.builtin.debug:
    msg: "Runner registration token generated successfully. Expires at: {{ github_runner_token_expires_at }}"

- name: Validate token was generated
  ansible.builtin.assert:
    that:
      - github_runner_token is defined
      - github_runner_token | length > 0
    fail_msg: "Failed to generate runner registration token"
    success_msg: "Runner registration token ready for use"
