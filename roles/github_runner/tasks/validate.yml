---
# Validation tasks for github_runner role
# Following AGENTS.md standard: roles MUST validate externally provided variables

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - github_runner_url is defined
      - github_runner_url | length > 0
      - github_runner_url is match('^https://github\.com/')
    fail_msg: "github_runner_url must be defined and be a valid GitHub repository URL (https://github.com/...)"
    success_msg: "GitHub repository URL is valid"

- name: Validate GitHub runner token
  ansible.builtin.assert:
    that:
      - github_runner_token is defined
      - github_runner_token | length > 0
    fail_msg: "github_runner_token must be defined and non-empty"
    success_msg: "GitHub runner token is provided"
  no_log: true

- name: Validate platform is supported
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['RedHat', 'Windows']
    fail_msg: "Unsupported platform: {{ ansible_os_family }}. Only RedHat and Windows are supported."
    success_msg: "Platform {{ ansible_os_family }} is supported"

- name: Validate runner version format
  ansible.builtin.assert:
    that:
      - github_runner_version is match('^\d+\.\d+\.\d+$')
    fail_msg: "github_runner_version must be in format X.Y.Z (e.g., 2.311.0)"
    success_msg: "Runner version {{ github_runner_version }} is valid"

- name: Validate runner name
  ansible.builtin.assert:
    that:
      - github_runner_name is defined
      - github_runner_name | length > 0
      - github_runner_name is match('^[a-zA-Z0-9_-]+$')
    fail_msg: "github_runner_name must be defined and contain only alphanumeric characters, hyphens, and underscores"
    success_msg: "Runner name '{{ github_runner_name }}' is valid"

- name: Validate labels format (if provided)
  ansible.builtin.assert:
    that:
      - github_runner_labels is iterable
      - github_runner_labels is not string
    fail_msg: "github_runner_labels must be a list"
    success_msg: "Runner labels format is valid"
  when: github_runner_labels | length > 0

# Platform-specific validation for RHEL
- name: Validate RHEL prerequisites
  when: ansible_os_family == 'RedHat'
  block:
    - name: Check if systemd is available
      ansible.builtin.command: systemctl --version
      register: systemd_check
      changed_when: false
      failed_when: systemd_check.rc != 0

    - name: Verify systemd is functional
      ansible.builtin.assert:
        that:
          - systemd_check.rc == 0
        fail_msg: "systemd is required for RHEL runner service management"
        success_msg: "systemd is available"

# Platform-specific validation for Windows
- name: Validate Windows prerequisites
  when: ansible_os_family == 'Windows'
  block:
    - name: Check PowerShell version
      ansible.windows.win_shell: $PSVersionTable.PSVersion.Major
      register: ps_version
      changed_when: false

    - name: Verify PowerShell version
      ansible.builtin.assert:
        that:
          - ps_version.stdout | int >= 5
        fail_msg: "PowerShell 5.0 or higher is required"
        success_msg: "PowerShell {{ ps_version.stdout | trim }} is available"
